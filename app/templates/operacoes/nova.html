{% extends "layout/base.html" %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header">
        <h3 class="mb-0">Nova Operação</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            {{ form.hidden_tag() }}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Representante
                    </label>
                    {{ form.cliente_id() }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Fábrica
                    </label>
                    {{ form.fabrica_id() }}
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Colaborador
                    </label>
                    {{ form.colaborador_id() }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Data da Operação
                    </label>
                    {{ form.data_operacao() }}
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Observações
                </label>

                {{ form.observacao() }}

            </div>

            <hr>

            <div class="d-flex justify-content-end">

                <a
                    href="{{ url_for('operacoes.listar') }}"
                    class="btn btn-secondary me-2"
                >
                    Cancelar
                </a>

                {{ form.submit() }}

            </div>

        </form>

    </div>

</div>

{% endblock %}
